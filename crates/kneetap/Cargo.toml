[package]
name = "kneetap"
description = "Reports which server answered a request and what it received"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["http", "debugging", "server"]
categories = ["command-line-utilities", "development-tools::debugging"]
default-run = "kneetap"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["color", "derive", "env", "error-context", "help", "std", "usage"] }
humantime.workspace = true
kneetap-client.workspace = true
kneetap-server.workspace = true
serde_json.workspace = true
if-addrs.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "time"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "json", "std"] }

[target."cfg(unix)".dependencies]
privdrop.workspace = true

[dev-dependencies]
rcgen.workspace = true
rstest.workspace = true

[build-dependencies]
vergen-gitcl.workspace = true
