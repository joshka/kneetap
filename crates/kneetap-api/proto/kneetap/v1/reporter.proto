syntax = "proto3";

package kneetap.v1;

// Reports which instance answered a call and what it received.
service Reporter {
  // Returns the report for this call.
  rpc GetReport(GetReportRequest) returns (GetReportResponse);

  // Returns immediately, for load testing.
  rpc Ping(PingRequest) returns (PingResponse);
}

// Asks for a report. Call metadata is what the report describes.
message GetReportRequest {}

// What the server knows about itself and one call.
message GetReportResponse {
  // The operator's name for this instance, if it has one.
  optional string name = 1;
  // The host's name, if it could be determined.
  optional string hostname = 2;
  // The host's interface addresses, sorted.
  repeated string addresses = 3;
  // The address of the connected peer.
  string remote_addr = 4;
  // Metadata the call carried.
  repeated MetadataEntry metadata = 5;
  // The kneetap-server version.
  string version = 6;
  // The commit the server was built from, if the program running it knows.
  optional string commit = 7;
  // When the server started serving, as an RFC 3339 UTC timestamp.
  string started_at = 8;
  // An ID for this call that no other request to any server has.
  string request_id = 9;
  // When the server received this call, as an RFC 3339 UTC timestamp.
  string received_at = 10;
  // The connection the call arrived on.
  Connection connection = 11;
}

// The connection a call arrived on, which shows whether a client or proxy reuses connections.
message Connection {
  // An opaque ID, only meaningful compared with another report's.
  string id = 1;
  // This call's place on the connection, counting from 1 in the order calls started.
  uint64 request_number = 2;
  // When the server accepted the connection, as an RFC 3339 UTC timestamp.
  string opened_at = 3;
}

// One metadata value. A name can appear more than once.
message MetadataEntry {
  // The lowercase metadata name.
  string name = 1;
  // The value, with bytes that aren't UTF-8 escaped.
  string value = 2;
}

// An empty load-testing call.
message PingRequest {}

// The reply to a load-testing call.
message PingResponse {}
