[package]
name = "kneetap-client"
description = "Client for querying kneetap servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["http", "debugging", "client"]

[lints]
workspace = true

[dependencies]
futures-util = { workspace = true, features = ["std"] }
kneetap-api.workspace = true
reqwest = { workspace = true, features = ["http2", "rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time"] }
tokio-rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
kneetap-server = { path = "../kneetap-server" }
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt"] }
