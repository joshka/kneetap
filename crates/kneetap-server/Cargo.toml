[package]
name = "kneetap-server"
description = "Embeddable server that reports which instance answered and what it received"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["http", "debugging", "server"]

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "http2", "query", "tokio"] }
base64 = { workspace = true, features = ["std"] }
futures-util.workspace = true
hostname.workspace = true
humantime.workspace = true
if-addrs.workspace = true
itertools.workspace = true
kneetap-api.workspace = true
mime.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "time"] }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
proptest = { workspace = true, features = ["std"] }
reqwest.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util"] }
tower = { workspace = true, features = ["util"] }
