[package]
name = "kneetap-server"
description = "Embeddable server that reports which instance answered and what it received"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["http", "debugging", "server"]

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
base64 = { workspace = true, features = ["std"] }
hostname.workspace = true
if-addrs.workspace = true
kneetap-api.workspace = true
mime.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
insta = { workspace = true, features = ["json", "redactions"] }
reqwest.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tower = { workspace = true, features = ["util"] }
