[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshka/kneetap"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", default-features = false }
base64 = { version = "0.23", default-features = false }
clap = { version = "4.6", default-features = false }
futures-util = { version = "0.3", default-features = false }
h2 = "0.4"
hostname = "0.4"
humantime = "2"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
if-addrs = "0.15"
insta = "1"
itertools = "0.15"
kneetap-api = { path = "crates/kneetap-api", version = "0.1.0" }
kneetap-client = { path = "crates/kneetap-client", version = "0.1.0" }
kneetap-server = { path = "crates/kneetap-server", version = "0.1.0" }
mime = "0.3"
privdrop = "0.5"
proptest = { version = "1", default-features = false }
prost = "0.14"
protox = "0.10"
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false }
rstest = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false }
serde = { version = "1", default-features = false }
serde_json = "1"
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tonic = { version = "0.14", default-features = false }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = { version = "0.14", default-features = false }
tower = { version = "0.5", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
url = "2"
webpki-roots = "1"
x509-parser = "0.18"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
dbg_macro = "warn"
mod_module_files = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
