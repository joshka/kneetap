[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshka/kneetap"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false }
base64 = { version = "0.23", default-features = false }
clap = { version = "4.6", default-features = false }
futures-util = { version = "0.3", default-features = false }
hostname = "0.4"
humantime = "2"
if-addrs = "0.15"
insta = "1"
itertools = "0.15"
kneetap-api = { path = "crates/kneetap-api", version = "0.1.0" }
kneetap-client = { path = "crates/kneetap-client", version = "0.1.0" }
kneetap-server = { path = "crates/kneetap-server", version = "0.1.0" }
mime = "0.3"
proptest = { version = "1", default-features = false }
reqwest = { version = "0.13", default-features = false }
rstest = { version = "0.26", default-features = false }
serde = { version = "1", default-features = false }
serde_json = "1"
tokio = { version = "1", default-features = false }
tower = { version = "0.5", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
dbg_macro = "warn"
mod_module_files = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
