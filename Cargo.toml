[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshka/kneetap"

[workspace.dependencies]
clap = { version = "4.6", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
dbg_macro = "warn"
mod_module_files = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
