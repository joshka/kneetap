# Configuration for https://release-plz.dev. Lives at the root because that's where it's looked up.

[workspace]
# Versions come from git tags until the crates are published.
git_only = true
publish = false
semver_check = false
git_tag_name = "v{{ version }}"
pr_name = "Release {{ version }}"
changelog_path = "./CHANGELOG.md"

[changelog]
header = "# Changelog\n"
body = """
## {{ version }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
"""
trim = false

[[package]]
name = "kneetap"
version_group = "kneetap"

[[package]]
name = "kneetap-api"
version_group = "kneetap"
git_tag_enable = false
changelog_update = false

[[package]]
name = "kneetap-client"
version_group = "kneetap"
git_tag_enable = false
changelog_update = false

[[package]]
name = "kneetap-server"
version_group = "kneetap"
git_tag_enable = false
changelog_update = false
